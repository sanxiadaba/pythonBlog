[project]
name = "python-blog"
version = "3.0.0"
description = "个人博客：Markdown 写作，Flask + SQLite"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "flask-limiter>=3.12,<5",
    "flask-sqlalchemy>=3.1,<4",
    "flask-wtf>=1.2,<2",
    "mistune>=3.1,<4",
    "pillow>=11,<13",
    "pygments>=2.19,<3",
    "python-dotenv>=1.1,<2",
    "waitress>=3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["static", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

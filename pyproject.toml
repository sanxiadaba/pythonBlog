[project]
name = "python-blog"
version = "2.0.0"
description = "A modernized Flask personal blog application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleach>=6.2,<7",
    "flask>=3.1,<4",
    "flask-limiter>=3.12,<5",
    "flask-migrate>=4.1,<5",
    "flask-sqlalchemy>=3.1,<4",
    "flask-wtf>=1.2,<2",
    "loguru>=0.7,<1",
    "pillow>=11,<13",
    "pymysql>=1.1,<2",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
    "waitress>=3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["static"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

